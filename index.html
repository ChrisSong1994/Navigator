<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="导航精灵 —— 链接导航页，配置来自 global_original.json5，可本地修改、导入导出" />
    <title>导航精灵</title>
    <script>
      // 首屏前先定好明暗，避免闪白；正式逻辑在 useResolvedTheme 里
      try {
        var config = JSON.parse(localStorage.getItem('navigator:config') || 'null')
        var mode = (config && config.settings && config.settings.themeMode) || 'system'
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
